name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version such as 1.2.3." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          g++ --std=c++11 src/*.cpp -o "dist/airetzar-ng-${VERSION}-linux-x86_64"
          cd dist
          sha256sum "airetzar-ng-${VERSION}-linux-x86_64" > "airetzar-ng-${VERSION}-linux-x86_64.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="dist/airetzar-ng-${VERSION}-linux-x86_64"
          gh release create "v${VERSION}" \
            "$asset" \
            "${asset}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "airetzar-ng v${VERSION}" \
            --generate-notes
